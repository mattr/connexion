app = "connexion"
primary_region = "syd"
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]
  dockerfile = "Dockerfile"

  [build.args]
    PUBLIC_POCKETBASE_URL = "https://connexion.fly.dev"

[env]
  PUBLIC_POCKETBASE_URL = "https://connexion.fly.dev"

[mounts]
  source = "connexion_data"
  destination = "/data"
  initial_size = "1gb"
  snapshot_retention = 7

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
