app = "connexion"
kill_signal = "SIGINT"
kill_timeout = "5s"
primary_region = "syd"

[build]
dockerfile = "Dockerfile"

  [build.args]
  PUBLIC_POCKETBASE_URL = "https://connexion.fly.dev"

[env]
PUBLIC_POCKETBASE_URL = "https://connexion.fly.dev"

[http_service]
auto_start_machines = true
auto_stop_machines = true
force_https = true
internal_port = 8_080
min_machines_running = 0
processes = [ "app" ]

  [[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/api/health"
  timeout = "5s"

  [http_service.concurrency]
  hard_limit = 100
  soft_limit = 50
  type = "requests"

[[mounts]]
destination = "/data"
initial_size = "1gb"
snapshot_retention = 7
source = "connexion_data"

[[vm]]
memory = "256mb"
size = "shared-cpu-1x"
